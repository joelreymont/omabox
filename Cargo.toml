[package]
name = "omabox"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
dropbox-live = []

[dependencies]
base64 = "0.23"
form_urlencoded = "1.2"
miette = { version = "7.6", features = ["fancy"] }
rusqlite = "0.37"
rustix = { version = "1.1", features = ["fs", "rand"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["asm"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
insta = "1.43"
proptest = "1.7"
tempfile = "3.21"

[[bin]]
name = "omabox"
path = "src/bin/omabox.rs"

[[bin]]
name = "omaboxd"
path = "src/bin/omaboxd.rs"
