[package]
name = "omabox"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
miette = { version = "7.6", features = ["fancy"] }
rusqlite = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
insta = "1.43"
proptest = "1.7"
tempfile = "3.21"

[[bin]]
name = "omabox"
path = "src/bin/omabox.rs"

[[bin]]
name = "omaboxd"
path = "src/bin/omaboxd.rs"
